# `cargo nextest` reads this file for every run. The default profile only adds
# a per-test timeout: a hung test is killed after period * terminate-after
# (5 minutes) instead of stalling the whole run.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# CI-specific nextest profile. The `ci` profile inherits `default`, so it gets
# the same per-test timeout.
#
# `fail-fast` and `retries` are mirrored on the command line when needed, but
# keeping them here means a caller cannot accidentally reintroduce retries:
# a flaky test is a defect, not a pass (`justfile` known-failures note).
[profile.ci]
fail-fast = false
retries = 0

# JUnit output lands at target/nextest/ci/junit.xml. The shard jobs upload it
# when the run fails, so a red job keeps the per-test evidence.
[profile.ci.junit]
path = "junit.xml"
store-failure-output = true
report-skipped = "ignored"
