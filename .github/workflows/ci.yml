name: CI

on:
  pull_request:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.impact.outputs.docs_only }}
      windows_required: ${{ steps.impact.outputs.windows_required }}
      test_matrix: ${{ steps.impact.outputs.test_matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Check CI helper syntax
        shell: bash
        run: |
          for script in scripts/ci/*.mjs; do
            node --check "$script"
          done
          node -e 'JSON.parse(require("fs").readFileSync(".github/quality/policy.json"))'
          node -e 'JSON.parse(require("fs").readFileSync(".github/quality/tools.lock.json"))'
      - name: Calculate impact
        id: impact
        run: node scripts/ci/impact.mjs
      - name: Check quality drift
        shell: bash
        run: node scripts/ci/check-quality-drift.mjs

  build:
    name: build
    needs: policy
    if: needs.policy.result == 'success' && needs.policy.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
      - name: Install nextest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nyan-tools/nextest"
          nextest="$(node scripts/ci/fetch-tool.mjs nextest --dest "$RUNNER_TEMP/nyan-tools/nextest")"
          dirname "$nextest" >> "$GITHUB_PATH"
      - name: Build nextest archive
        shell: bash
        run: cargo nextest archive --locked --lib --archive-file "$RUNNER_TEMP/nyan-tests.tar.zst"
      - name: Save Cargo cache on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust.outputs.cache-primary-key }}
      - name: Upload nextest archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nyan-tests
          path: ${{ runner.temp }}/nyan-tests.tar.zst
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  static:
    name: static
    needs: policy
    if: needs.policy.result == 'success' && needs.policy.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nyan-tools/actionlint"
          actionlint="$(node scripts/ci/fetch-tool.mjs actionlint --dest "$RUNNER_TEMP/nyan-tools/actionlint")"
          dirname "$actionlint" >> "$GITHUB_PATH"
      - name: Check default and internal builds
        run: |
          cargo check --locked --lib --tests
          cargo check --locked --lib --tests --features anthropic_internal
      - name: Run clippy gates
        run: |
          cargo clippy --locked --lib --bins -- -D clippy::correctness -D clippy::disallowed_methods
          cargo clippy --locked --lib --tests -- -D clippy::correctness
      - name: Lint workflows
        run: actionlint

  tests:
    name: tests (${{ matrix.name }})
    needs: [policy, build]
    if: needs.policy.result == 'success' && needs.build.result == 'success' && needs.policy.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.test_matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install nextest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nyan-tools/nextest"
          nextest="$(node scripts/ci/fetch-tool.mjs nextest --dest "$RUNNER_TEMP/nyan-tools/nextest")"
          dirname "$nextest" >> "$GITHUB_PATH"
      - name: Install ripgrep
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nyan-tools/ripgrep"
          ripgrep="$(node scripts/ci/fetch-tool.mjs ripgrep --dest "$RUNNER_TEMP/nyan-tools/ripgrep")"
          dirname "$ripgrep" >> "$GITHUB_PATH"
      - name: Install sandbox bridge dependency
        shell: bash
        run: |
          # `utils/sandbox/network_proxy.rs` starts the Linux proxy bridges
          # through `socat`; the unit tests exercise that path directly.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends socat
      - name: Download nextest archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: nyan-tests
          path: ${{ runner.temp }}/nyan-tests
      - name: Run test shard
        shell: bash
        run: |
          CI=true scripts/ci/test.sh \
            --archive "$RUNNER_TEMP/nyan-tests/nyan-tests.tar.zst" \
            --partition "${{ matrix.partition }}"
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 3
          overwrite: true

  supply_chain:
    name: supply-chain
    needs: policy
    if: needs.policy.result == 'success' && needs.policy.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install supply-chain tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nyan-tools/gitleaks" "$RUNNER_TEMP/nyan-tools/cargo-deny"
          gitleaks="$(node scripts/ci/fetch-tool.mjs gitleaks --dest "$RUNNER_TEMP/nyan-tools/gitleaks")"
          cargo_deny="$(node scripts/ci/fetch-tool.mjs cargo-deny --dest "$RUNNER_TEMP/nyan-tools/cargo-deny")"
          dirname "$gitleaks" >> "$GITHUB_PATH"
          dirname "$cargo_deny" >> "$GITHUB_PATH"
      - name: Scan repository snapshot for secrets
        shell: bash
        run: |
          snapshot="$RUNNER_TEMP/nyan-snapshot"
          mkdir -p "$snapshot"
          git archive HEAD | tar -x -C "$snapshot"
          gitleaks detect --no-git --source "$snapshot" --config "$snapshot/.gitleaks.toml"
      - name: Check dependency policy
        run: cargo-deny --locked check

  windows_check:
    name: windows-check
    needs: policy
    if: needs.policy.result == 'success' && needs.policy.outputs.docs_only != 'true' && needs.policy.outputs.windows_required == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Restore Windows build cache
        id: windows-target-cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf
        with:
          path: target
          key: windows-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-target-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare pinned ripgrep
        shell: pwsh
        env:
          RIPGREP_VERSION: '15.2.0'
          RIPGREP_SHA256: '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
        run: |
          $ErrorActionPreference = 'Stop'
          $ripgrepName = "ripgrep-$($env:RIPGREP_VERSION)-x86_64-pc-windows-msvc"
          $ripgrepZip = Join-Path $env:RUNNER_TEMP "$ripgrepName.zip"
          $ripgrepDir = Join-Path $env:RUNNER_TEMP 'ripgrep-extract'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$($env:RIPGREP_VERSION)/$ripgrepName.zip" -OutFile $ripgrepZip
          $actualSha = (Get-FileHash -Algorithm SHA256 -Path $ripgrepZip).Hash.ToLowerInvariant()
          if ($actualSha -ne $env:RIPGREP_SHA256) {
            throw "ripgrep SHA256 mismatch: $actualSha"
          }
          Expand-Archive -Path $ripgrepZip -DestinationPath $ripgrepDir
          $vendorDir = Join-Path $env:GITHUB_WORKSPACE 'vendor/ripgrep/x64-win32'
          New-Item -ItemType Directory -Force $vendorDir | Out-Null
          Copy-Item (Join-Path $ripgrepDir "$ripgrepName/rg.exe") (Join-Path $vendorDir 'rg.exe')
          $rgOutput = & (Join-Path $vendorDir 'rg.exe') --version
          if ($LASTEXITCODE -ne 0 -or "$rgOutput" -notmatch '^ripgrep ') {
            throw "bundled rg.exe --version failed: $rgOutput"
          }
      - name: Build Windows release binary
        shell: pwsh
        run: cargo build --release --locked --bin nyan
      - name: Run Windows release smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target/release/nyan.exe'
          $releaseVendor = Join-Path $env:GITHUB_WORKSPACE 'target/release/vendor/ripgrep/x64-win32'
          New-Item -ItemType Directory -Force $releaseVendor | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'vendor/ripgrep/x64-win32/rg.exe') (Join-Path $releaseVendor 'rg.exe')
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'nyan-config'
          New-Item -ItemType Directory -Force $env:CLAUDE_CONFIG_DIR | Out-Null

          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^nyan ') { throw "nyan.exe --version failed: $version" }
          $help = & $exe --help
          if ($LASTEXITCODE -ne 0 -or "$help" -notmatch 'Usage: nyan') { throw "nyan.exe --help failed" }
          $doctor = & $exe doctor 2>&1 | Out-String
          $doctorExit = $LASTEXITCODE
          if (($doctorExit -ne 0 -and $doctorExit -ne 1) -or [string]::IsNullOrWhiteSpace($doctor)) {
            throw "no-model startup smoke failed (exit $doctorExit): $doctor"
          }

          $rg = Join-Path $releaseVendor 'rg.exe'
          $rgVersion = & $rg --version
          if ($LASTEXITCODE -ne 0 -or "$rgVersion" -notmatch '^ripgrep ') { throw "release rg.exe --version failed: $rgVersion" }
      - name: Run targeted Windows runtime smoke tests
        shell: pwsh
        env:
          USE_BUILTIN_RIPGREP: '1'
        run: cargo test --locked --lib windows_smoke -- --nocapture
      - name: Save Windows build cache on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.windows-target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf
        with:
          path: target
          key: ${{ steps.windows-target-cache.outputs.cache-primary-key }}

  gate:
    name: Merge gate
    needs: [policy, build, static, tests, supply_chain, windows_check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Evaluate merge gate
        env:
          CI_GATE_RESULTS: >-
            {"policy":"${{ needs.policy.result }}","build":"${{ needs.build.result }}",
            "static":"${{ needs.static.result }}","tests":"${{ needs.tests.result }}",
            "supply-chain":"${{ needs.supply_chain.result }}",
            "windows-check":"${{ needs.windows_check.result }}"}
          CI_GATE_IMPACT: >-
            {"docs_only":"${{ needs.policy.outputs.docs_only }}",
            "windows_required":"${{ needs.policy.outputs.windows_required }}"}
        run: node scripts/ci/gate.mjs
